server {
    listen 80;
    server_name pideturno.ceet.org.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pideturno.ceet.org.es;

    ssl_certificate /etc/letsencrypt/live/pideturno.ceet.org.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pideturno.ceet.org.es/privkey.pem;

    resolver 127.0.0.11 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}